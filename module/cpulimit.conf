# oplus-cloud-block - CPU 上限解除配置
#
# ENABLE   : 1 开启该功能；0 关闭（关闭=立即还原出厂上限）
# TEMP     : 机身/外壳类温区的收回阈值，毫摄氏度。55000 = 55.0°C
#            （实测游戏满频时机身约 54°C，55 留余量）
# TEMP_CPU : CPU 结温类温区的收回阈值，毫摄氏度。80000 = 80.0°C
#            ⚠️ 必须与 TEMP 分开，不能共用：CPU 结温静置就 ~50°C、满频可到 90°C+，
#            而同期外壳只有 37~40°C。共用 55°C 会在游戏刚开几秒就收回，体验全毁。
# ZONE     : 保护监视的温区（首选，按名字精确匹配）。默认 skin-msm-therm（机身表面）。
#            本机没有时自动替补：先找 CPU 结温家族（cpu-0-*/cpullc-*/cpu_big* 等，
#            阈值自动切到 TEMP_CPU），都没有才退到外壳家族（阈值用 TEMP）。
#            ⚠️ 不要手动选 shell_front/shell_back —— 实测游戏满频时它们仅 37~40°C
#            而机身已 54°C，新机型上三个 shell_* 甚至同值、完全不随负载动，用它形同虚设。
# MODE     : global = 全局常开；game = 检测到游戏运行时才开；
#            apps = 仅 cpulimit.apps 里勾选的应用在前台时才开（WebUI「指定应用」）。
# HYST     : 滞回，毫摄氏度。3000 = 3°C。降到阈值-HYST 以下才恢复，防阈值附近反复横跳。
#
ENABLE=1
TEMP=55000
TEMP_CPU=80000
ZONE=skin-msm-therm
MODE=game
HYST=3000
