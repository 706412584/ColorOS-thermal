# oplus-cloud-block - CPU 上限解除配置
#
# ENABLE   : 1 开启该功能；0 关闭（关闭=立即还原出厂上限）
# TEMP     : 机身/外壳类温区的收回阈值，毫摄氏度。55000 = 55.0°C
#            （实测游戏满频时机身约 54°C，55 留余量）
# TEMP_CPU : CPU 结温类温区的收回阈值，毫摄氏度。80000 = 80.0°C
#            ⚠️ 必须与 TEMP 分开，不能共用：CPU 结温静置就 ~50°C、满频可到 90°C+，
#            而同期外壳只有 37~40°C。共用 55°C 会在游戏刚开几秒就收回，体验全毁。
# ZONE     : 保护监视的温区（首选，按名字精确匹配）。默认 skin-msm-therm（机身表面）。
#            本机没有时自动替补：先找 CPU 结温家族（cpu-0-*/cpullc-*/cpu_big* 等，
#            阈值自动切到 TEMP_CPU），都没有才退到外壳家族（阈值用 TEMP）。
#            ⚠️ 不要手动选 shell_front/shell_back —— 实测游戏满频时它们仅 37~40°C
#            而机身已 54°C，新机型上三个 shell_* 甚至同值、完全不随负载动，用它形同虚设。
# MODE     : global = 全局常开；game = 检测到游戏运行时才开；
#            apps = 仅 cpulimit.apps 里勾选的应用在前台时才开（WebUI「指定应用」）。
#            game 模式下，cpulimit.apps 勾选的应用同样生效（系统认不出游戏时的兜底）。
# HYST     : 滞回，毫摄氏度。3000 = 3°C。降到阈值-HYST 以下才恢复，防阈值附近反复横跳。
# SMART_ENABLE : 1 开启游戏/日常智能调和；0 保持旧版行为（默认）。
# DAILY_PROFILE: auto = 仅使用本机已验证的日常降顶档位；off = 日常保持系统调度。
# AFFINITY_ENABLE: 1 允许按数据目录 smartsched.rules 的显式游戏规则写 TID affinity。
#                 先用 cpulimit.sh observe [包名] 只读观察，不要盲目绑核。
# ---- 游戏热预算（高通平台，默认全关；v01.7.75 新增） ----
# 实测（PJA110 吃鸡 20 分钟）：大核 3187MHz 的尾部功耗把 CPU 温区推到 73~76°C，
# GPU 到 67°C 后厂商温控把 GPU 压到 475MHz、屏幕限亮 —— 掉帧和变暗同源。
# 这组开关的思路是"再分配"：把大核省出来的热换 GPU 不降档，不是再解锁。
# GAME_CPU_SWEET : off | hw。hw = 大核「稳健档」：游戏时大核只用第二高档（实测 PJA110：3187→2726MHz），
#                 帧率几乎不掉、发热明显降低。off = 满频（旧行为）。
#                 与完整解锁同一个节点和同一套备份/还原，稳健档只是写不同值。
# GPU_GUARD      : off | 1。GPU 过热保护（只在高通 kgsl 有温度读数时生效）：GPU 达到
#                 GPU_GUARD_TEMP 即降大核频率，降到阈值-HYST 并连续两拍才恢复。
#                 皮肤信号太慢（实测 GPU 降档时皮肤才 52.5°C），必须看 GPU 自己。
# GPU_GUARD_TEMP : GPU 过热触发线，毫摄氏度。60000 = 60.0°C（实测降档在 67°C，留提前量）。
# GPU_GUARD_ACTION: sweet = 大核落稳健档（推荐）；neutral = 整体降频（更保守）。
# DISP_GUARD     : off | 1。防掉帧变暗：屏幕被降刷新率/限亮前主动整体降频、最快降温。
#                 实测 PJA110：显示温度 49°C 落深档 → 屏幕切 60Hz（帧率被锁死）+ 100nit 限亮；
#                 其他机型的触发温度和动作可能不同，本保护按皮肤温度提前降频。
#                 到 DISP_GUARD_TEMP 整体降频；降到线-HYST 且连续两拍恢复。
# DISP_GUARD_TEMP: 防掉帧触发线（皮肤温区），毫摄氏度。51500 = 51.5°C（实测 PJA110 屏幕降档时皮肤 52+）。
# GAME_GPU_CAP   : off | 具体频率（如 615000000，须在本机 GPU 可用档列表里）。
#                 实验功能：写 kgsl devfreq max_freq，只降上限、不锁只读、
#                 不与厂商温控抢写（它压得更低时让它压）。收益未证实，逐机实测。
#
ENABLE=1
TEMP=55000
TEMP_CPU=80000
ZONE=skin-msm-therm
MODE=game
HYST=3000
SMART_ENABLE=0
DAILY_PROFILE=auto
AFFINITY_ENABLE=0
GAME_CPU_SWEET=hw
GPU_GUARD=off
GPU_GUARD_TEMP=60000
GPU_GUARD_ACTION=sweet
DISP_GUARD=1
DISP_GUARD_TEMP=51500
GAME_GPU_CAP=off
