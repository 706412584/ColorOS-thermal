# oplus-cloud-block - CPU 上限解除配置
#
# ENABLE : 1 开启该功能；0 关闭（关闭=立即还原出厂上限）
# TEMP   : 触发收回的温度阈值，毫摄氏度。55000 = 55.0°C（实测游戏满频时机身约 54°C，55 留余量）
# ZONE   : 保护监视的温区。默认 skin-msm-therm（机身表面 = 体感温度）。
#          ⚠️ 不要用 shell_front —— 实测游戏满频时它仅 39.7°C 而机身已 54°C，用它会形同虚设。
# MODE   : global = 全局常开；game = 仅当系统检测到游戏时才开（读 /proc/game_opt/game_pid）。
# HYST   : 滞回，毫摄氏度。3000 = 3°C。降到 TEMP-HYST 以下才恢复，防阈值附近反复横跳。
#
ENABLE=1
TEMP=55000
ZONE=skin-msm-therm
MODE=game
HYST=3000
